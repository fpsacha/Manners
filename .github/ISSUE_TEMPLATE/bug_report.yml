name: Something misbehaved
description: The prompt did the wrong thing, or nothing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. The easy way: in the game, press
        **Report a bug** (Diagnostics, the button with the Diagnostics icon at
        the bottom of the options window, the minimap menu, or `/manners bug`).
        It opens a link to this form with the category, your class, the game and
        the version filled in, and gives you the report to paste into **The full
        check-up** below. If you press **Mark this moment** the second something
        goes wrong, the report shows what Manners saw then.

        By hand instead: open the options (`/manners`), go to **Diagnostics**,
        press **Run a full check-up**, click in the box, Ctrl+A, Ctrl+C, and
        paste it into the check-up box. If you can, run it right after the bug
        happens: it keeps what happened over the last few minutes, even through
        a /reload.

  - type: dropdown
    id: category
    attributes:
      label: What went wrong
      options:
        - The prompt never showed up
        - It offered the wrong buff or person
        - A fight button (cure, Will of the Forsaken, Mend Pet)
        - The options window
        - An error message
        - Something else
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - WoW Forever
        - Classic Era
        - Burning Crusade Classic
        - Mists of Pandaria Classic
        - Retail
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        A priest buffed me. The prompt appeared with their name on it. I clicked
        it and nothing was cast — no error, no spell.
    validations:
      required: true

  - type: input
    id: class
    attributes:
      label: Your class
      placeholder: Priest
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: The full check-up
      description: >
        Options (/manners) > Diagnostics > Run a full check-up, then click in
        the box, Ctrl+A, Ctrl+C, and paste the whole thing here. It holds the
        self-test, what this client allows, your settings, what /manners debug
        and /manners errors say, and the last few minutes of what Manners saw
        and did. Other players are named Person 1, Person 2, and so on.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Addon version
      description: >
        The last line of /manners debug, or the version on the CurseForge file
        you installed.
      placeholder: Filled in by the Report a bug button
    validations:
      required: true

  - type: dropdown
    id: others
    attributes:
      label: Other addons
      options:
        - Manners only, everything else disabled
        - Other addons running, I have not tried disabling them
        - Other addons running, and it still happens with them off
    validations:
      required: true

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: >
        A screenshot of the prompt is worth a lot here. Please blank out other
        players' names if you would rather not publish them.
    validations:
      required: false
