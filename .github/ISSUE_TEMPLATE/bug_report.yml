name: Something misbehaved
description: The prompt did the wrong thing, or nothing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Only Mage has been used in game. Priest, Druid, Paladin, Warlock and
        Warrior are implemented and tested against a mock client, but nobody has
        cast with them — so if you are one of those, a report is genuinely
        useful even if you are not sure anything is wrong.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        A priest buffed me. The prompt appeared with their name on it. I clicked
        it and nothing was cast — no error, no spell.
    validations:
      required: true

  - type: input
    id: class
    attributes:
      label: Your class
      placeholder: Priest
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Output of /manners debug
      description: >
        Paste the whole thing. It reports what this client will and will not let
        the addon read, which is where most of this addon's problems come from —
        and it differs between characters, not just between installs.
      render: text
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Output of /manners errors
      description: >
        Anything the addon caught and carried on from. Empty is a useful answer
        and means something different from "I did not check".
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Addon version
      description: >
        The last line of /manners debug, or the version on the CurseForge file
        you installed.
      placeholder: 0.9.6
    validations:
      required: true

  - type: dropdown
    id: others
    attributes:
      label: Other addons
      options:
        - Manners only, everything else disabled
        - Other addons running, I have not tried disabling them
        - Other addons running, and it still happens with them off
    validations:
      required: true

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: >
        A screenshot of the prompt is worth a lot here. Please blank out other
        players' names if you would rather not publish them.
    validations:
      required: false
