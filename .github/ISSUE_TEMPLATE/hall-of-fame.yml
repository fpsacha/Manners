name: Hall of fame
description: Every milestone earned? Ask for your place among the Gentlefolk of Good Manners
title: "Hall of fame: "
labels: [hall-of-fame]
body:
  - type: markdown
    attributes:
      value: |
        Congratulations, and thank you for your manners. When a character has
        earned every milestone of the favour ledger it can earn, two things
        are asked for a place: a screenshot of its certificate, and its code.

        1. In the options (`/manners`), on **Start here**, open **Gentlefolk
           of Good Manners** and press **Show my certificate**. The favour
           ledger opens on its Milestones tab with the certificate beside it.
        2. Take a screenshot with the game's Print Screen key. The picture is
           saved in the game's Screenshots folder.
        3. Copy the code from the box under the button (click in the box,
           Ctrl+A, Ctrl+C), then fill in the two fields below.

        Your character's name is then added to the list in the README and to
        the one inside the addon with the next release. It is an invitation and
        nothing more: nothing of value is asked for a place. The code and the
        certificate name your character, its class, your game client and the
        day of your last milestone, and nothing else.

  - type: input
    id: code
    attributes:
      label: Your code
      description: The whole line from the box, starting MANNERS1-
      placeholder: MANNERS1-CAMELOT-MAGE-20261114-4D6F7274204465667265747465-0-DA8EF87D
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: The screenshot of your certificate
      description: >-
        Drag the picture into this box, or click in it and paste. Wait for the
        upload to finish: a line starting with ![ appears. The whole
        certificate should be in the picture: your name, the date, the count
        of milestones and the code.
      placeholder: Drag your screenshot here.
    validations:
      required: true

  - type: input
    id: note
    attributes:
      label: A few words beside your name (optional)
      description: A guild, a motto, a greeting. Short, please; it is shown in the list.
    validations:
      required: false
