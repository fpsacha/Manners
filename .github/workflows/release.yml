name: Release

# Tag a version and this builds and publishes it:
#
#   git tag v0.9.0 && git push origin v0.9.0
#
# The packager reads .pkgmeta, fetches the libraries listed there as
# externals, and assembles the zip. That is why Libs/ is gitignored: the
# repository deliberately does not carry them, so a release built any other way
# ships an addon that cannot load. Build releases through this workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Lua runtime the tests need
        run: pip install lupa

      - name: Structure and syntax
        run: python tests/validate.py

      - name: Load the addon against a mock client
        run: python tests/runharness.py

      - name: Adversarial scenarios
        run: python tests/runscenarios.py

      # A suite that cannot go red proves nothing. This reintroduces each fault
      # class it is supposed to catch and fails the build if any goes unnoticed.
      - name: Confirm the suites can still fail
        run: |
          python tests/selftest.py | tee selftest.out
          if grep -q "MISSED\|ANCHOR GONE" selftest.out; then
            echo "::error::a check no longer detects the fault it exists for"
            exit 1
          fi

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A missing secret makes the packager quietly skip CurseForge, which looks
      # identical to a successful upload in the log. Say which destinations are
      # actually configured before building.
      - name: Report which destinations are configured
        run: |
          say() {
            # $1 destination, $2 token set?, $3 toc directive it needs
            local id
            id=$(grep -m1 "^## $3:" Manners.toc | cut -d: -f2- | xargs)
            if [ -z "$2" ] && [ -z "$id" ]; then
              echo "::warning::$1: no token and no $3 -- skipped"
            elif [ -z "$2" ]; then
              echo "::warning::$1: id $id, but no token -- skipped"
            elif [ -z "$id" ]; then
              echo "::warning::$1: token set, but no $3 in the toc -- nothing to upload to"
            else
              echo "$1: id $id, token set"
            fi
          }
          say CurseForge   "${{ secrets.CF_API_KEY }}"       X-Curse-Project-ID
          say Wago         "${{ secrets.WAGO_API_TOKEN }}"   X-Wago-ID
          say WoWInterface "${{ secrets.WOWI_API_TOKEN }}"   X-WoWI-ID

      # One section of CHANGELOG.md, for this tag only. Fails the release if
      # the section is missing or empty, so notes cannot be forgotten -- the
      # packager would otherwise fall back to dumping the git log.
      - name: Release notes for this tag
        run: |
          python tools/release_notes.py "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "---- RELEASE_NOTES.md ----"
          cat RELEASE_NOTES.md

      - name: Package and publish
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Add these in the repository's secrets to publish beyond GitHub.
          # Without them the packager simply skips that destination.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
