name: CI

# The test suites used to run only when a version tag was pushed, which meant a
# commit could break the addon and nothing would say so until release day --
# and by then the fix and the release are the same commit. This runs them on
# every push instead.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    # The whole job takes minutes now. Past half an hour something is stuck --
    # a mutation that turned a loop endless, say -- and GitHub's own limit is
    # six hours of a runner doing nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Lua runtime the tests need
        run: pip install lupa

      # Structure, syntax, and that the three files claiming a version agree.
      - name: Structure and syntax
        run: python tests/validate.py

      - name: Load the addon against a mock client
        run: python tests/runharness.py

      - name: Adversarial scenarios
        run: python tests/runscenarios.py

      # A suite that cannot go red proves nothing. This reintroduces each fault
      # class it is supposed to catch and fails the build if any goes unnoticed.
      # Here only that every mutation still finds the code it changes: since the
      # options window (1.6.0) the whole run -- 1,900 mutations, and a scenario
      # trace that alone outlasts half an hour on a runner's four cores -- no
      # longer fits. The whole run is made before every release instead
      # (RELEASING.md).
      #
      # `shell: bash` is not decoration. A step with no shell runs under
      # `bash -e` without pipefail, so the pipe's exit status is tee's, which is
      # always 0 -- and a WRONG CHECK, a NOT RESTORED or a traceback went green.
      # Spelled out, GitHub runs it with -eo pipefail and selftest's own status
      # fails the step. The grep is only there to put a readable line in the
      # summary, so it names every failure selftest.py prints -- anchored to the
      # start of its summary lines, because a mutation's label or a caught
      # check's message may use the same words on a run that passed.
      - name: Every mutation still finds its code
        shell: bash
        run: |
          python tests/selftest.py --anchors | tee selftest.out
          if grep -q "^\(MISSED\|ANCHOR GONE\|WRONG CHECK\|NOT RESTORED\): " selftest.out; then
            echo "::error::a check no longer detects the fault it exists for"
            exit 1
          fi

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install Pillow numpy lupa

      # The listing images draw a Chinese prompt, and nothing on the runner has
      # the glyphs for it; make-screenshots.py --strict refuses rather than draw
      # boxes. DejaVu is named because the renderers fall back to it.
      - name: Fonts for the listing images
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-dejavu-core

      # This used to assert the committed icon was byte-identical to what the
      # generator produces here, on the reasoning that the icon is pure
      # geometry with no text and therefore renders identically everywhere.
      # That was wrong, and it failed the first time it ran against a real
      # release: Pillow's resampling and PNG encoding differ between versions
      # and platforms, so the same code produces a 143,665-byte file on the
      # author's Windows machine and a 146,524-byte one here.
      #
      # Byte equality across platforms was never available. What is checked is
      # that the generator runs and produces images of the right size -- and
      # drift is caught where it can be: running the generator locally and
      # finding `git status` dirty, which tools/README.md documents.
      - name: The icon generator still runs
        run: |
          python tools/make-icon.py
          python - <<'EOF'
          from PIL import Image
          for name, want in (("icon-512.png", 512), ("icon-64.png", 64)):
              im = Image.open(".github/media/" + name)
              assert im.size == (want, want), (name, im.size)
              print("ok", name, im.size)
          EOF
          git checkout -- .github/media

      # The listing images are drawn by tools/render_prompt.py and
      # render_ledger.py from the addon itself, loaded on the mock client, so
      # they cannot show a layout it no longer builds. Byte equality is still
      # not available: the faces here are DejaVu and Noto, not the Candara and
      # Segoe UI they were drawn with. What --strict adds is that a picture
      # which would show something other than what it claims -- a state the
      # addon cannot reach, a guarded error, the wrong person or reason on the
      # prompt, a translation still in English, a script the face cannot draw
      # -- fails the step instead of being drawn.
      - name: The listing images still draw from the addon
        run: |
          python tools/make-screenshots.py --strict
          python - <<'EOF'
          from PIL import Image
          for name in ("prompt", "reasons", "ledger", "languages", "palette"):
              im = Image.open(".github/media/manners-%s.png" % name)
              assert im.width == 1280 and im.height >= 300, (name, im.size)
              print("ok", name, im.size)
          EOF
          git checkout -- .github/media

      # A --strict that can never refuse passes every run, so it is shown
      # refusing: the same addon with its German emptied must stop the German
      # picture from being drawn in English, and write nothing at all.
      - name: A strict run refuses a picture it cannot vouch for
        run: |
          stale="$RUNNER_TEMP/stale"
          mkdir -p "$stale"
          git archive HEAD | tar -x -C "$stale"
          echo "-- emptied" > "$stale/Locales/deDE.lua"
          if python tools/make-screenshots.py --strict --addon "$stale" --out "$stale/out" 2> refused.txt; then
            echo "::error::make-screenshots.py --strict drew a German picture from an addon with no German"
            exit 1
          fi
          cat refused.txt
          grep -q "refusing to draw" refused.txt
          grep -q "still in English" refused.txt
          test ! -e "$stale/out"
